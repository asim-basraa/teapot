name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A full local stack: Postgres, GoTrue, and Mailpit for the confirmation
      # email. Migrations in supabase/migrations are applied on start, so the
      # suite runs against the same schema as staging and production.
      - name: Start Supabase
        run: supabase start

      # NEXT_PUBLIC_* values are inlined at build time, so they must be in the
      # environment before `next build`, not just before the tests.
      - name: Export Supabase credentials
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            # The local stack's JWT secret is fixed and public; it is what the
            # MCP endpoint signs a user's access token with. Nothing secret
            # about it here, and nothing that resembles the real one.
            echo "SUPABASE_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_ENV=e2e"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
          } >> "$GITHUB_ENV"

      # The security tests of the product. Every access decision is made by
      # effective_role and its wrappers, so this suite is what holds that
      # decision to account. It runs before the browser tests because a
      # failure here invalidates everything above it.
      - name: Authorization suite
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/authorization.sql

      # The browser download dominates this job's runtime, so it is cached
      # against the Playwright version rather than the lockfile: the browsers
      # only change when Playwright itself does.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # The browser binary is restored, but its shared libraries are not.
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - run: npm run build

      - run: npm run test:e2e

      # Deliberately terse: a full `supabase status` dump here pushes the
      # Playwright failure output out of the readable tail of the log.
      - name: Container health on failure
        if: failure()
        run: docker ps --format '{{.Names}}\t{{.Status}}'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

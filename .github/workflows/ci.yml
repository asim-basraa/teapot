name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A full local stack: Postgres, GoTrue, and Mailpit for the confirmation
      # email. Migrations in supabase/migrations are applied on start, so the
      # suite runs against the same schema as staging and production.
      - name: Start Supabase
        run: supabase start

      # NEXT_PUBLIC_* values are inlined at build time, so they must be in the
      # environment before `next build`, not just before the tests.
      - name: Export Supabase credentials
        run: |
          STATUS=$(supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_ENV=e2e"
            echo "MAILPIT_URL=http://127.0.0.1:54324"
          } >> "$GITHUB_ENV"

      - name: Verify the signup gate is wired
        run: |
          # Cheap guard: if the hook is missing the suite would still pass its
          # happy path while silently accepting any address.
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc \
            "select public.hook_restrict_signup_by_email_domain('{\"user\":{\"email\":\"x@gmail.com\"}}'::jsonb) ->> 'error' is not null" \
            | grep -qx t

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run test:e2e

      - name: Supabase logs on failure
        if: failure()
        run: supabase status && docker ps -a

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
